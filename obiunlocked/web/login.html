<!doctype html><html><head><meta charset=utf-8><link rel=icon href=/favicon.svg>
<meta name=viewport content='width=device-width,initial-scale=1'><title>ObiUnlocked — Anmelden</title><link rel=stylesheet href=/app.css><style>
body{min-height:100vh;display:grid;place-items:center;padding:16px}


.box{width:min(92vw,360px);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:26px 24px}
.logo{display:none}
h1{font-size:17px;margin:0 0 3px;text-align:center}.sub{color:var(--dim);font-size:12.5px;text-align:center;margin-bottom:20px}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px}
input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:11px 12px;font-size:16px}
button{width:100%;margin-top:18px;background:var(--ac);color:#fff;border:0;border-radius:6px;padding:12px;font-weight:700;font-size:15px;cursor:pointer}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:12px;text-align:center}

.pagebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--p1);border-bottom:1px solid var(--ln);font-size:13px}
.pagebar>b{font-size:15px;font-weight:600}
</style></head><body>
<form class=box id=lf>
 <div class=logo></div>
 <h1>ObiUnlocked</h1><div class=sub>Please sign in</div>
 <label>User</label><input id=u autocomplete=username autofocus>
 <label>Password</label><input id=p type=password autocomplete=current-password>
 <button type=submit>Sign in</button>
 <div class=err id=err></div>
</form>
<script>
const $=i=>document.getElementById(i);
// Bind via addEventListener (NOT inline onsubmit) so the handler can't be shadowed by a form control id.
document.getElementById('lf').addEventListener('submit',async e=>{
 e.preventDefault();const err=$('err'),btn=e.submitter||$('lf').querySelector('button');
 err.textContent='';if(btn)btn.disabled=true;
 try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},
   body:'user='+encodeURIComponent($('u').value)+'&pass='+encodeURIComponent($('p').value)});
  if(r.ok){location.href='/';return;}
  err.textContent='Wrong user or password';}
 catch(x){err.textContent='Connection error';}
 if(btn)btn.disabled=false;});
</script></body></html>
