 window.appStatus&&window.appStatus(st);
 $('#pair_st').textContent=st.pair_remaining_s>0?L.pairon.replace('%s',st.pair_remaining_s):L.pairoff;
 _hideUnbound=!!st.hide_unbound;_pairActive=st.pair_remaining_s>0;
 const cb=$('#hideunb_cb');if(document.activeElement!==cb)cb.checked=_hideUnbound;
 const nU=rs.filter(r=>!r.assigned).length;$('#hideunb_w').style.display=nU?'':'none';
 $('#hideunb_badge').innerHTML=_hideUnbound&&nU&&!_pairActive?(_revealTmp?`<a href="#" id="unb_hide">${L.unbHideAgain}</a>`:`${nU} ${L.unbHidden} · <a href="#" id="unb_show">${L.unbShow}</a>`):'';
 const hf=st.hist_fs;
 $('#ft').textContent=`${L.uptime} ${dur(st.uptime_s)} · ${L.heap} ${kb(st.max_alloc_heap)}`+(st.fw?` · ObiUnlocked ${st.fw.version} (${st.fw.target})`:'')+
  (hf&&hf.ok?` · ${L.histfs} ${kb(hf.total-hf.used)}/${kb(hf.total)} · ${L.dailyfs} ${kb(hf.daily_total-hf.daily_used)}/${kb(hf.daily_total)}`:'')+` · ${st.gwid_ascii||''} ${st.mac||''}`;
 const ae=document.activeElement,busy=editId!==null||(ae&&/^(iv_|fw_)/.test(ae.id||''))||$$('#list input[type=file]').some(i=>i.files.length);
 if(!busy&&!uploading)drawReaders();
 if(st.ota&&st.ota.active){const el=$('#op_'+st.ota.target);if(el){const o=st.ota,at=o.pos!=null?o.pos:o.served,p=o.size?Math.min(100,Math.round(at/o.size*100)):0;
  el.textContent=L.otarun+' '+p+'%'+(o.pass>1?' · '+L.otapass.replace('%n',o.pass):'')+(o.pass>2?' — '+L.otaloop:'');}}
}catch(e){}}
const visRs=l=>(_hideUnbound&&!_revealTmp&&!_pairActive)?l.filter(r=>r.assigned):l;
function drawReaders(){const v=visRs(_rs);$('#list').innerHTML=v.length?v.map(card).join(''):(_rs.length?'':`<div class="card empty">${L.waiting}</div>`);}

const BOXES=['imp','exp','pow','batt','opt','seen'];
const val=(v,u)=>v===null?'<div class="v na">–</div>':`<div class="v">${nf(v)}${u?'<small>'+u+'</small>':''}</div>`;
const valE=v=>v===null?'<div class="v na">–</div>':`<div class="v">${nf(v/1000,3)}<small>kWh</small></div>`;
const bcol=p=>p>50?'var(--ac)':p>20?'var(--am)':'var(--rd)';
function boxInner(k,r){
 if(k=='imp')return`<div class="l">${L.imp}</div>${valE(r.import)}`;
 if(k=='exp')return`<div class="l">${L.exp}</div>${valE(r.export)}`;
 if(k=='pow')return`<div class="l">${L.pow}</div>${val(r.power,'W')}`;
 if(k=='batt'){const p=Math.max(0,Math.min(100,Math.round((r.battery_mV-2400)/8)));return`<div class="l">${L.batt}</div><div class="v">${(r.battery_mV/1000).toFixed(2)}<small>V</small></div><div class="batt"><i style="width:${p}%;background:${bcol(p)}"></i></div>`;}
 if(k=='opt')return`<div class="l">${L.opt}</div><div class="v" style="font-size:13.5px"><span class="dot ${r.infrared?'on':''}" style="display:inline-block;margin-right:6px"></span>${r.infrared?L.active:L.nosig}</div>`;
 if(k=='seen')return`<div class="l">${L.seen}</div><div class="v">${L.ago} ${age(r.age_s)}</div>`;return'';}
function boxOrder(r){const seen={},out=[];(r.boxcfg||'').split(',').forEach(t=>{t=t.trim();if(!t)return;const vis=t[0]!=='-',key=vis?t:t.slice(1);
 if(BOXES.includes(key)&&!seen[key]){seen[key]=1;out.push({key,vis});}});BOXES.forEach(key=>{if(!seen[key])out.push({key,vis:true});});return out;}
function tilesHtml(r){const o=boxOrder(r);if(editId!==r.id)return o.filter(b=>b.vis).map(b=>`<div class="tile">${boxInner(b.key,r)}</div>`).join('');

function renderEmpfang(){if(!U)return;const s=U.stats,t=Math.max(1,s.ms.reduce((a,b)=>a+b,0));
 $('#abar').innerHTML=s.ms.map((v,i)=>`<i style="width:${(100*v/t).toFixed(2)}%;background:${LIS[i][1]}"></i>`).join('');
 $('#leg').innerHTML=s.ms.map((v,i)=>`<span style="--c:${LIS[i][1]}">${LIS[i][0]} ${(100*v/t).toFixed(1)} %</span>`).join('');
 const okSum=s.ok.reduce((a,b)=>a+b,0);
 $('#stats').innerHTML=[[L.sOk,okSum+(s.ok.some(x=>x)?' ('+s.ok.map((v,i)=>v?LIS[i+1][0].replace('wM-Bus ','')+' '+v:'').filter(Boolean).join(', ')+')':'')],[L.sCrc,s.crc],[L.sObi,s.obi_frames],
  [L.sOff,s.obi_last_off+' / '+s.obi_max_off+' ms'],[L.sSw,s.switches+(s.switch_err?' · '+s.switch_err+' '+L.sErr:'')]].concat(s.qdrop?[[L.sDrop,s.qdrop]]:[])
  .map(([l,v])=>`<div class="st"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('');
 if(!cfgDrawn)drawCfg();}
function drawCfg(){if(!U)return;cfgDrawn=true;const c=U.cfg;
 const li=(i,k)=>`<label class="ck"><input type="checkbox" class="cl" data-i="${i}" ${c.listen>>i&1?'checked':''}><span>${L[k]}</span></label><div class="d">${L[k+'d']}</div>`;
 const chs=['868,1','868,3','868,5','867,1','867,3','867,5','867,7','867,9'];
 $('#opts').innerHTML=`<label class="ck"><input type="checkbox" id="c_obi" ${c.obi?'checked':''}><span>${L.obi}</span></label>`+li(0,'l0')+li(1,'l1')+li(2,'l2')+li(3,'l3')+li(4,'l4')+
  `<div class="chgrid">${chs.map((f,i)=>`<label class="ck"><input type="checkbox" class="cch" data-i="${i}" ${c.lwch>>i&1?'checked':''}>${f}</label>`).join('')}</div>
  <div class="chgrid">${[7,8,9,10,11,12].map((sf,i)=>`<label class="ck"><input type="checkbox" class="csf" data-i="${i}" ${c.lwsf>>i&1?'checked':''}>SF${sf}</label>`).join('')}<span class="mut">${L.sfhint}</span></div>`;
 $('#c_win').value=c.win;$('#c_avh').value=c.avh;}
const mask=s=>$$(s).reduce((m,e)=>m|(e.checked?1<<+e.dataset.i:0),0);
$('#c_save').onclick=async()=>{try{const r=await(await post('/api/unl/cfg',{obi:$('#c_obi').checked?1:0,listen:mask('.cl'),lwch:mask('.cch')||1,lwsf:mask('.csf')||1,win:$('#c_win').value,avh:$('#c_avh').value})).json();
 U.cfg=r.cfg;cfgDrawn=false;drawCfg();$('#c_msg').textContent=L.saved;setTimeout(()=>$('#c_msg').textContent='',3000);}catch(e){$('#c_msg').textContent='Fehler';}};

let logRows=[],logSince=0,logPaused=false,logNow=0;
const LMODE={1:'T1',2:'C1a',3:'C1b',4:'S1'};
function renderLog(){$('#logb').innerHTML=logRows.slice(-150).reverse().map(e=>`<tr><td class="dim">${age(Math.round((logNow-e.t)/1000))}</td><td>${LIS[e.l+1][0]}${e.l<2&&LMODE[e.m]?' <span class="mut">'+LMODE[e.m]+'</span>':e.l===4?' <span class="mut">SF'+e.m+'</span>':''}</td>
 <td class="mono" style="color:${e.r?'var(--rd)':'var(--tx)'}">${esc(e.who)}</td><td>${e.rssi}</td><td>${e.len}</td><td class="hex2">${fmtHex(e.b)}${e.len>e.b.length/2?' …':''}</td></tr>`).join('');}
async function pollLog(){if(logPaused||tab!=='empfang')return;try{const r=await(await fetch('/api/unl/log?since='+logSince)).json();logNow=r.now;
 if(r.e.length)logRows=logRows.concat(r.e).slice(-300);logSince=r.seq;renderLog();}catch(e){}}
$('#lpause').onclick=()=>{logPaused=!logPaused;$('#lpause').textContent=logPaused?L.resume:L.pause;};
$('#lclear').onclick=()=>{logRows=[];renderLog();};
/* ---------------- help ---------------- */
const DOC=`<h2>ObiUnlocked – Kurzanleitung</h2>
<p>Das Gateway hat einen Funkchip (SX1262) für 868 MHz. Es betreibt den <b>OBI-Lesekopf</b> am Stromzähler. In den Funkpausen hört es andere Geräte in der Umgebung mit: Heizkostenverteiler, Wasser- und Wärmezähler, Rauchmelder (wireless M-Bus), Wettersensoren und LoRaWAN-Geräte. Gesendet wird dabei nichts, nur für den OBI-Lesekopf.</p>
<h2>Bereiche</h2>
<table><tr><th>Stromzähler</th><td>Zeigt die OBI-Leseköpfe mit Bezug, Einspeisung, Leistung und Batterie.<ul><li>„Alle Lesegeräte binden“ nimmt 3 Minuten lang neue Leseköpfe automatisch an.</li><li>„Bearbeiten“: Namen vergeben und Kacheln anordnen (ziehen, ein- und ausblenden).</li><li>Das Intervall legt fest, wie oft der Lesekopf sendet.</li><li>„Lesekopf-Firmware über LoRa flashen“ spielt eine neue Lesekopf-Firmware ein. Die Version muss im Dateinamen stehen, z. B. <code>reader_v55.bin</code>.</li></ul></td></tr>
<tr><th>Meine Geräte</th><td>Deine ausgewählten Funkgeräte mit allen Werten. <b>Nur diese</b> werden per MQTT an Home Assistant gesendet.</td></tr>
<tr><th>In der Nähe</th><td>Alles, was das Gateway empfängt, auch Geräte der Nachbarn. „Hinzufügen“ übernimmt ein Gerät in „Meine Geräte“. Ein Klick auf eine Zeile öffnet die Details.</td></tr>
<tr><th>Empfang</th><td>Welche Funkarten das Gateway hört, wie sich die Funkzeit aufteilt, Statistik und Live-Log.</td></tr>
<tr><th>Verlauf</th><td>Tagesverbrauch und Kosten des Stromzählers, CSV-Export.</td></tr>
<tr><th>OBI-Funk</th><td>Live-Ansicht aller LoRa-Pakete zwischen Gateway und Lesekopf, für die Fehlersuche.</td></tr>
<tr><th>Einstellungen</th><td>WLAN, MQTT, Login, Zeitzone, Firmware-Update, Werksreset.</td></tr></table>
<h2>Werte verstehen</h2>
<ul><li><b>Zählerstand</b>: aktueller Stand. Wasser und Gas in m³, Wärme in kWh.</li>
<li><b>Stichtag</b> und <b>Stand am Stichtag</b>: Der Messdienst rechnet einmal im Jahr ab, meist zum 31.12. Manche Geräte speichern zusätzlich einen Monatsstichtag.</li>
<li><b>Verbrauch seit Stichtag</b>: Zählerstand minus Stand am Stichtag. Das ist dein Verbrauch im laufenden Abrechnungsjahr.</li>
<li><b>Verbrauchseinheiten</b> (Heizkostenverteiler): Das ist keine Energie, sondern ein Rechenwert. Was er in Heizkosten bedeutet, ergibt sich erst mit dem Umrechnungsfaktor aus der Abrechnung.</li>
<li><b>Status</b>: z. B. „OK“, „Batterie schwach“ oder „Dauerhafter Fehler“, direkt vom Gerät gemeldet.</li>
<li><b>Rauchmelder</b>: letzter Alarm, Anzahl der Alarme, Demontagen und letzter Druck auf den Testknopf. Bauart Ei Electronics zeigt zusätzlich:<ul><li>Verschmutzung von 0 bis 31, ab 28 reinigen</li><li>Batteriespannung</li><li>Melderstatus</li></ul></li></ul>
<h2>Verschlüsselte Geräte</h2>
<p>Viele Messdienste (Minol, Zenner, Techem, ista …) senden AES-verschlüsselt. Ohne Schlüssel siehst du Hersteller, ID, Typ, Signal und Status.</p>
<ul><li><b>Mit Schlüssel</b> siehst du alle Werte. Den AES-Schlüssel (32 Hex-Zeichen) trägst du im Detailfenster des Geräts ein.</li>
<li><b>Woher:</b> vom Messdienst, oder über Vermieter bzw. Hausverwaltung. Gib dazu die Geräte-ID aus der Liste an.</li>
<li>„Falscher Schlüssel“ heißt: Der Schlüssel gehört nicht zu diesem Gerät.</li></ul>
<p>LoRaWAN-Geräte sind ebenfalls verschlüsselt. Für eigene Geräte trägst du NwkSKey und AppSKey ein, z. B. aus der TTN-Konsole unter „Session information“. Sendet das Gerät im Format Cayenne LPP, erscheinen die Daten danach als Messwerte.</p>
<h2>„Empfang zu schwach“</h2>
<p>Das Gateway hat das Gerät gehört, aber mit Übertragungsfehlern (CRC-Fehler). Hersteller, ID und Typ stimmen trotzdem, weil der Gerätekopf eine eigene Prüfsumme hat. Die Messwerte dagegen sind unbrauchbar.</p>
<p>So bekommst du besseren Empfang:</p>
<ul><li>Gateway höher und freier aufstellen, nicht hinter Metall oder Beton. Rauchmelder hängen an der Decke.</li>
<li>Unter „Empfang“ weniger Funkarten aktivieren. Dann ist wM-Bus öfter an der Reihe.</li></ul>
<p>Ab etwa −105 dBm klappt der Empfang meist zuverlässig.</p>
<h2>Funkzeit</h2>
<p>Der Funkchip hört immer nur eine Funkart. Jede Sekunde läuft so ab:</p>
<ul><li>OBI-Beacon, danach 300 ms Hörfenster für den Lesekopf.</li>
<li>Im Rest der Sekunde hört ein anderer Empfänger: wM-Bus T1/C1 jede zweite Sekunde, die übrigen Funkarten abwechselnd.</li></ul>
<p>In diesen Situationen bleibt der Chip komplett beim OBI-Lesekopf:</p>
<ul><li>beim Koppeln und beim Lesekopf-Update</li>
<li>während „Alle binden“</li>
<li>in den ersten 2 Minuten nach dem Start</li>
<li>rund um jeden fälligen Zählerstand</li></ul>
<p>Fehlen OBI-Werte, erhöhe unter „Empfang“ das Hörfenster oder schalte Empfänger ab.</p>
<h2>Home Assistant</h2>
<p>MQTT richtest du unter Einstellungen ein. Jedes Gerät aus „Meine Geräte“ erscheint dann automatisch als eigenes Gerät in Home Assistant. Das nutzt MQTT-Discovery und braucht Home Assistant 2024.11 oder neuer.</p>
<ul><li><b>Topics:</b> <code>&lt;base&gt;/wmbus/&lt;Hersteller&gt;&lt;ID&gt;</code>, <code>&lt;base&gt;/weather/…</code> und <code>&lt;base&gt;/lorawan/…</code>, jeweils mit <code>/status</code> (online/offline).</li>
<li><b>Entfernen:</b> Nimmst du ein Gerät aus „Meine Geräte“ heraus, verschwindet es auch aus Home Assistant.</li>
<li><b>Energie-Dashboard:</b> Wasser-, Gas- und Wärmezähler lassen sich dort direkt verwenden.</li></ul>
<h2>Hilfe bei Problemen</h2>
<ul><li><b>Gerät taucht nicht auf:</b> Manche Geräte, z. B. Rauchmelder, senden nur wenige Male am Tag. Prüfe den Live-Log unter „Empfang“.</li>
<li><b>Viele CRC-Fehler im Live-Log:</b> Der Empfang ist zu schwach, siehe oben.</li>
<li><b>Lesekopf meldet keine Werte:</b> Taste am Lesekopf kurz drücken, das startet die Infrarot-Lesung. Hilft das nicht, das Hörfenster erhöhen.</li>
<li><b>Gateway nicht erreichbar:</b> Fehlt das WLAN, erscheint der Hotspot <code>ObiUnlocked-XXXXXX</code>. Gehäusetaste 5 Sekunden halten setzt das Gateway auf Werkseinstellungen zurück.</li></ul>
`;
let docDrawn=false;function drawDoc(){if(docDrawn)return;docDrawn=true;$('#doc').innerHTML=DOC;}
