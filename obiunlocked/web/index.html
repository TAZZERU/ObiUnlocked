*{box-sizing:border-box}

.top{display:flex;align-items:center;gap:14px;padding:9px 20px;max-width:1280px;margin:0 auto;flex-wrap:wrap}

.tools{display:flex;gap:4px;flex-wrap:wrap;align-items:center}

.seg{display:inline-flex;border:1px solid var(--ln);border-radius:5px;overflow:hidden}
.seg button{background:var(--p1);border:0;padding:4px 9px;cursor:pointer;color:var(--dim);font-size:12px}.seg button.on{background:var(--p3);color:var(--tx);font-weight:600}

nav.tabs a.on{color:var(--tx);border-color:var(--ac);font-weight:600}nav.tabs a .n{font-size:11.5px;color:var(--mut);margin-left:5px;font-weight:400}
main{max-width:1280px;margin:0 auto;padding:16px 20px 30px}
section[hidden]{display:none}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.note{color:var(--dim);font-size:12.5px;line-height:1.55}.note b{color:var(--tx);font-weight:600}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:6px;padding:12px 14px}
.empty{padding:24px;text-align:center;color:var(--dim)}
input[type=text],input[type=number],input:not([type]),select{background:var(--p1);border:1px solid var(--ln);border-radius:5px;padding:5px 8px;min-width:0}

.tag.ok{color:var(--ok)}.tag.warn{color:var(--am)}.tag.bad{color:var(--rd)}.tag.info{color:var(--dim)}
.readers{display:flex;flex-direction:column;gap:10px}
.rc.pend{opacity:.7}
.rh{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.rh .nm{font-size:15.5px;font-weight:600}.rh .meta{color:var(--dim);font-size:12px}
.ib{background:none;border:1px solid var(--ln);color:var(--dim);border-radius:4px;padding:2px 8px;cursor:pointer;font-size:12px}
.ib:hover{color:var(--tx)}.ib.on{color:var(--ac);border-color:var(--ac)}.ib.del:hover{color:var(--rd)}.ib:disabled{opacity:.4;cursor:not-allowed}
.uuid{font-family:var(--mono);font-size:11.5px;color:var(--mut);margin:4px 0 10px;word-break:break-all}

.tile{padding:8px 12px;min-width:0;position:relative;background:var(--p2)}
.tile .l{font-size:12px;color:var(--dim)}
.tile .v{font-family:var(--mono);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tile .v small{font-size:12px;color:var(--dim);margin-left:4px}.tile .v.na{color:var(--mut)}
.batt{height:3px;background:var(--p3);margin-top:5px}.batt>i{display:block;height:100%}
.tile.edit{cursor:grab;padding-top:30px}.tile.edit.hid{opacity:.5}.tile.drag{outline:2px dashed var(--ac);outline-offset:-2px}
.tile .bh,.tile .be{position:absolute;top:5px;height:20px;border-radius:3px;border:1px solid var(--ln);background:var(--p1);font-size:11px;display:grid;place-items:center}
.tile .bh{left:5px;width:22px;pointer-events:none;color:var(--mut)}.tile .be{right:5px;cursor:pointer;padding:0 6px;color:var(--dim)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.ivseg{display:flex;border:1px solid var(--ln);border-radius:5px;overflow:hidden;max-width:100%;overflow-x:auto}
.ivseg button,.ivseg input{background:var(--p1);border:0;border-right:1px solid var(--ln);border-radius:0;padding:4px 9px;font-size:12.5px;color:var(--dim)}
.ivseg button{cursor:pointer}.ivseg button.on{background:var(--acbg);color:var(--ac);font-weight:600}.ivseg input{width:64px;text-align:center;color:var(--tx);border-right:0}
.ivseg .set{background:var(--ac);color:#fff;border-right:0}
details.adv{margin-top:8px}details summary{cursor:pointer;color:var(--dim);font-size:12.5px}
.hint{color:var(--am);font-size:12.5px;margin-top:8px}.boot{color:var(--am);font-size:12.5px;margin-bottom:6px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters input[type=text]{flex:1 1 220px}
.cats{display:flex;border:1px solid var(--ln);border-radius:5px;overflow:hidden;flex-wrap:wrap}
.cats button{background:var(--p1);border:0;border-right:1px solid var(--ln);padding:4px 10px;cursor:pointer;color:var(--dim);font-size:12.5px}
.cats button:last-child{border-right:0}.cats button.on{background:var(--p3);color:var(--tx);font-weight:600}
.tw{overflow-x:auto;background:var(--p1);border:1px solid var(--ln);border-radius:6px}
table.dl{width:100%;border-collapse:collapse;font-size:13px}
table.dl th{text-align:left;font-weight:600;color:var(--dim);font-size:12px;padding:7px 10px;border-bottom:1px solid var(--ln);background:var(--p2);white-space:nowrap}
table.dl td{padding:7px 10px;border-bottom:1px solid var(--p3);white-space:nowrap;vertical-align:middle}
table.dl tbody tr{cursor:pointer}table.dl tbody tr:hover{background:var(--p2)}table.dl tr:last-child td{border-bottom:0}
table.dl td.val{font-family:var(--mono);text-align:right}table.dl th.r{text-align:right}
table.dl .nm{font-weight:600}table.dl .sub{font-size:12px;color:var(--mut)}
.ov{position:fixed;inset:0;background:#0006;z-index:50;display:flex;justify-content:flex-end}.ov[hidden]{display:none}
.pane{width:min(600px,100%);height:100%;background:var(--p1);border-left:1px solid var(--ln);overflow-y:auto;padding:16px 20px}
.pane h2{margin:0;font-size:17px;font-weight:600}.pane h3{font-size:12.5px;margin:18px 0 6px;color:var(--dim);font-weight:600}
.vt{width:100%;border-collapse:collapse;font-size:13.5px}.vt td{padding:6px 4px;border-bottom:1px solid var(--p3);vertical-align:top}

<header>
 <div class="top">

   <div class="seg"><button id="lde">DE</button><button id="len">EN</button></div>

   <a class="btn" href="/settings" id="t_set"><span class="lb"></span></a>
   <a class="btn" href="/debug" id="t_dbg"><span class="lb"></span></a>
   <button class="btn" id="t_reboot"><span class="lb"></span></button>
   <button class="btn" id="t_logout" hidden><span class="lb"></span></button>
  </div>
 </div>
 <nav class="tabs"><a href="#strom" data-t="strom"></a><a href="#funk" data-t="funk"></a><a href="#empfang" data-t="empfang"></a></nav>
</header>
<main>
<section id="s_strom">
 <div class="bar"><button class="btn pri" id="pair_btn"></button><span class="dim" id="pair_st"></span><span class="sp"></span>
  <label class="ck" id="hideunb_w"><input type="checkbox" id="hideunb_cb"><span id="hideunb_lbl"></span></label><span class="dim" id="hideunb_badge"></span></div>
 <div class="readers" id="list"></div>
</section>
<section id="s_funk" hidden>
 <div class="filters"><input type="text" id="q"><div class="cats" id="cats"></div>
  <label class="ck"><input type="checkbox" id="onlysel"><span id="onlysel_l"></span></label>
  <select id="sort"></select></div>
 <div class="tw"><table class="dl"><thead><tr id="dl_h"></tr></thead><tbody id="devs"></tbody></table></div>

</section>
<section id="s_empfang" hidden>
 <div class="card"><div class="dim" id="air_t" style="font-size:12.5px"></div><div class="abar" id="abar"></div><div class="leg" id="leg"></div>
  <div class="stats" id="stats"></div><div class="bar" style="margin:12px 0 0"><button class="btn sm" id="st_reset"></button></div></div>
 <div class="cols">
  <div class="card"><h3 style="margin:0 0 10px;font-size:14px" id="cfg_t"></h3><div class="opts" id="opts"></div>
   <div class="frm"><span class="dim" id="win_l" style="align-self:center"></span><input type="number" id="c_win" min="100" max="900" step="10" style="flex:0 0 100px"><span class="dim" style="align-self:center">ms</span></div>
   <div class="frm"><span class="dim" id="avh_l" style="align-self:center"></span><input type="number" id="c_avh" min="1" max="720" style="flex:0 0 90px"><span class="dim" style="align-self:center">h</span></div>
   <div class="frm"><button class="btn pri" id="c_save"></button><span class="dim" id="c_msg" style="align-self:center"></span></div></div>
  <div class="card note" id="how"></div>
 </div>
 <div class="card" style="margin-top:14px"><div class="bar"><b id="log_t"></b><span class="sp"></span><button class="btn sm" id="lpause"></button><button class="btn sm" id="lclear"></button></div>

</section>
<footer id="ft"></footer>
</main>
<div class="ov" id="ov" hidden><div class="pane" id="pane"></div></div>

function kind(d){if(d.t==='wm')return d.tname+' · '+d.id+' · '+d.mode;if(d.t==='wx')return d.k+(d.exp?' · '+L.xp:'');return d.mtype+' · SF'+d.sf+' · '+d.freq+' MHz';}
function sub(d){if(d.t==='wm')return(d.mfrn||d.mfr)+' · '+(d.name?d.tname+' · ':'')+d.id+' · '+d.mode;if(d.t==='wx')return d.k+(d.exp?' · '+L.xp:'');return d.mtype+' · SF'+d.sf+' · '+d.freq+' MHz';}
function badge(d){if(d.t==='wm'){const x=DECT[d.dec];return x?`<span class="tag ${x[1]}">${L[x[0]]}</span>`:'';}if(d.t==='lw')return d.keys?`<span class="tag ${d.main=='Schlüssel falsch'?'bad':'ok'}">${L.keyS}</span>`:'';return d.exp?`<span class="tag warn">${L.xp}</span>`:'';}
function renderUnl(){if(!U)return;renderCats();$('#n_funk')&&($('#n_funk').textContent=U.wm.length+U.wx.length+U.lw.length);
 const q=$('#q').value.trim().toLowerCase(),only=$('#onlysel').checked;
 let L2=allDevs().filter(d=>(cat==='all'||catOf(d)===cat)&&(!only||d.sel)&&(!q||[d.k,d.name,d.tname,d.mfr,d.mfrn,d.proto,d.main].join(' ').toLowerCase().includes(q)));
 const cmp={rssi:(a,b)=>(b.rssi||-999)-(a.rssi||-999),age:(a,b)=>(a.age??1e9)-(b.age??1e9),name:(a,b)=>title(a).localeCompare(title(b))}[sortBy];
 L2.sort((a,b)=>(b.sel-a.sel)||cmp(a,b));
 $('#dl_h').innerHTML=`<th>HA</th><th>${L.hDev}</th><th class="hm">${L.hMfr}</th><th class="r">${L.hVal}</th><th class="hm">${L.hSig}</th><th>${L.hSeen}</th><th class="hm">${L.hStat}</th>`;
 $('#devs').innerHTML=L2.map(d=>{const m=d.main||'',mut=!m||/^(verschlüsselt|FCnt|Join|Schlüssel)/.test(m);
  return`<tr data-t="${d.t}" data-k="${d.k}"><td><input type="checkbox" data-sel="1" title="${L.tooHA}" ${d.sel?'checked':''}></td>
  <td><div class="nm">${esc(title(d))}</div><div class="sub">${esc(kind(d))}</div></td><td class="hm">${esc(d.t==='wm'?(d.mfrn||d.mfr):d.t==='wx'?d.proto.split(' ')[0]:'LoRaWAN')}</td>
  <td class="val${mut?' mut':''}">${esc(m||'–')}</td><td class="hm">${d.rssi} dBm</td><td>${age(d.age)}</td><td class="hm">${badge(d)}</td></tr>`;}).join('');
 $('#devs_empty').hidden=U.wm.length+U.wx.length+U.lw.length>0;$('#devs_empty').textContent=L.nodev;}
$('#devs').addEventListener('click',async e=>{const c=e.target.closest('tr[data-k]');if(!c)return;
 if(e.target.dataset.sel!==undefined){{await post('/api/unl/dev',{t:c.dataset.t,k:c.dataset.k,sel:e.target.checked?1:0});loadUnl();}return;}
 openDetail(c.dataset.t,c.dataset.k);});
async function loadUnl(){try{U=await(await fetch('/api/unl')).json();renderUnl();renderEmpfang();if(openDev&&!paneBusy())openDetail(openDev.t,openDev.k,true);}catch(e){}}
/* ---------------- detail pane ---------------- */
const paneBusy=()=>$('#pane').contains(document.activeElement)&&/INPUT|SELECT/.test(document.activeElement.tagName);
function closeDetail(){openDev=null;$('#ov').hidden=true;}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeDetail();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden)closeDetail();});
const fmtHex=h=>h?h.replace(/(..)/g,'$1 ').trim():'';
function fmtVal(v,u){if(typeof v==='number')return esc(nf(v))+(u?' <small>'+esc(u)+'</small>':'');if(typeof v==='boolean')return v?(lang=='de'?'ja':'yes'):(lang=='de'?'nein':'no');
 if(typeof v==='string'&&/^\d{4}-\d\d-\d\d$/.test(v))return esc(new Date(v+'T00:00').toLocaleDateString(loc()));
 if(typeof v==='string'&&/^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(v))return esc(new Date(v).toLocaleString(loc(),{dateStyle:'medium',timeStyle:'short'}));return esc(v);}
async function openDetail(t,k,refresh){openDev={t,k};let x;try{x=await(await fetch('/api/unl/dev?t='+t+'&k='+encodeURIComponent(k))).json();}catch(e){return;}
 if(!openDev||openDev.k!==k)return;const d={...x.dev,t};openData=x;
 let empty='';if(!x.vals.length){if(t==='wm')empty=x.cached===false?L.novalsCache:d.dec==='no_key'?L.novalsEnc:d.dec==='wrong_key'?L.novalsBad:(d.ci>=0xA0&&d.ci<=0xB7)?L.novalsMfr:L.novals;else if(t==='lw')empty=d.keys?L.novalsBad:L.nolw;else empty=L.novals;}
 const main=x.vals.filter(v=>!v.d),diag=x.vals.filter(v=>v.d);
 const tech=t==='wm'?[['Hersteller',(d.mfrn?d.mfrn+' ':'')+'('+d.mfr+')'],['ID',d.id],['Typ',d.tname+' (0x'+d.type.toString(16).padStart(2,'0')+')'],['Version',d.ver],['Funkmodus',d.mode],['CI','0x'+d.ci.toString(16)],
   ['Verschlüsselung',d.sec?'AES Mode '+d.sec:'keine'],['Status',d.stxt+' (0x'+d.status.toString(16).padStart(2,'0')+')'],['Decoder',x.decoder||'OMS / DIF-VIF']]
  :t==='wx'?[['Protokoll',d.proto],['ID',d.id],['Kanal',d.ch]]
  :[['Typ',d.mtype],[d.join?'DevEUI':'DevAddr',d.k.replace(/^J/,'')],['Frame-Zähler',d.fcnt],['Port',d.fport??'–'],['Nutzdaten',d.plen+' Byte'],['SNR',d.snr+' dB'],['Kanal',d.freq+' MHz · SF'+d.sf]];
 tech.push(['RSSI',d.rssi+' dBm'],['Zuletzt',age(d.age)],['Empfangen',d.count+'×']);
 $('#pane').innerHTML=`<div class="bar" style="margin:0"><div style="flex:1;min-width:0"><h2>${esc(title(d))}</h2><div class="dim" style="font-size:12.5px">${esc(sub(d))}</div></div><button class="btn" id="pclose">${L.close}</button></div>
 <div class="bar" style="margin:12px 0 0"><label class="ck"><input type="checkbox" id="psel" ${d.sel?'checked':''}>${L.tooHA}</label><span class="sp"></span>${badge(d)}</div>
 <h3>${L.values}</h3>${main.length?`<table class="vt">${main.map(v=>`<tr><td>${esc(v.l)}</td><td class="v">${fmtVal(v.v,v.u)}</td></tr>`).join('')}</table>`:`<div class="note">${empty}</div>`}
 <h3>${L.name}</h3><div class="frm" style="margin:0"><input id="pname" maxlength="24" value="${esc(d.name)}" placeholder="${esc(title({...d,name:''}))}"><button class="btn" id="pnsave">${L.save}</button></div>
 ${t==='wm'?`<h3>${L.key}</h3><div class="frm" style="margin:0"><input id="pkey" class="mono" placeholder="${d.key?'••••••••••••••••••••••••••••••••':'00112233445566778899AABBCCDDEEFF'}" maxlength="47" autocomplete="off"><button class="btn pri" id="pkset">${L.keyset}</button>${d.key?`<button class="btn bad" id="pkdel">${L.keydel}</button>`:''}</div>`:''}
 ${t==='lw'&&!d.join?`<h3>${L.lwkeys}</h3><div class="frm" style="margin:0"><input id="pnwk" class="mono" placeholder="NwkSKey" maxlength="47" autocomplete="off"><input id="papp" class="mono" placeholder="AppSKey" maxlength="47" autocomplete="off"><button class="btn pri" id="plset">${L.keyset}</button>${d.keys?`<button class="btn bad" id="pldel">${L.keydel}</button>`:''}</div>`:''}
 <details><summary class="dim" style="cursor:pointer;margin-top:18px">${L.tech}${diag.length?' · '+diag.length:''}</summary><div class="kv" style="margin-top:10px">${tech.map(([a,b])=>`<span>${a}</span><span class="mono">${esc(b)}</span>`).join('')}</div>
  ${diag.length?`<table class="vt" style="margin-top:10px">${diag.map(v=>`<tr class="dg"><td>${esc(v.l)}</td><td class="v">${fmtVal(v.v,v.u)}</td></tr>`).join('')}</table>`:''}</details>
 ${x.frame||x.phy?`<details><summary class="dim" style="cursor:pointer;margin-top:12px">${L.raw}</summary><div class="hex" style="margin-top:8px">${fmtHex(x.frame||x.phy)}</div>${x.plain?`<div class="hex" style="margin-top:6px;color:var(--ac)">${fmtHex(x.plain)}</div>`:''}</details>`:''}
 <div class="frm" style="margin-top:22px"><button class="btn bad" id="pforget">${L.forget}</button></div>`;
 $('#ov').hidden=false;
 const set=async b=>{const r=await post('/api/unl/dev',{t,k,...b});if(!r.ok){try{alert((await r.json()).err||'Fehler');}catch(e){alert('Fehler');}}loadUnl();};
 $('#pclose').onclick=closeDetail;$('#psel').onchange=e=>set({sel:e.target.checked?1:0});
 $('#pnsave').onclick=()=>set({name:$('#pname').value});
 if($('#pkset'))$('#pkset').onclick=()=>{const v=$('#pkey').value.trim();if(!/^[0-9a-fA-F:\s-]{32,47}$/.test(v))return alert(L.key);set({key:v});};
 if($('#pkdel'))$('#pkdel').onclick=()=>set({key:''});
 if($('#plset'))$('#plset').onclick=()=>set({nwk:$('#pnwk').value.trim(),app:$('#papp').value.trim()});
 if($('#pldel'))$('#pldel').onclick=()=>set({nwk:'',app:''});
 $('#pforget').onclick=async()=>{if(!confirm(L.forgetq))return;await post('/api/unl/dev',{t,k,forget:1});closeDetail();loadUnl();};}
/* ---------------- reception tab ---------------- */
const LIS=[['OBI','#2f6db5'],['wM-Bus T1/C1','#4f9a6b'],['wM-Bus S1','#8a6fb0'],['Bresser','#b08a3e'],['LaCrosse','#5f9ea8'],['LoRaWAN','#a35d5d']];
function renderEmpfang(){if(!U)return;const s=U.stats,t=Math.max(1,s.ms.reduce((a,b)=>a+b,0));
 $('#abar').innerHTML=s.ms.map((v,i)=>`<i style="width:${(100*v/t).toFixed(2)}%;background:${LIS[i][1]}"></i>`).join('');
 $('#leg').innerHTML=s.ms.map((v,i)=>`<span style="--c:${LIS[i][1]}">${LIS[i][0]} ${(100*v/t).toFixed(1)} %</span>`).join('');
 const okSum=s.ok.reduce((a,b)=>a+b,0);
 $('#stats').innerHTML=[[L.sOk,okSum+(s.ok.some(x=>x)?' ('+s.ok.map((v,i)=>v?LIS[i+1][0].replace('wM-Bus ','')+' '+v:'').filter(Boolean).join(', ')+')':'')],[L.sCrc,s.crc],[L.sObi,s.obi_frames],
  [L.sOff,s.obi_last_off+' / '+s.obi_max_off+' ms'],[L.sSw,s.switches+(s.switch_err?' · '+s.switch_err+' '+L.sErr:'')]].concat(s.qdrop?[[L.sDrop,s.qdrop]]:[])
  .map(([l,v])=>`<div class="st"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('');
 if(!cfgDrawn)drawCfg();}
function drawCfg(){if(!U)return;cfgDrawn=true;const c=U.cfg;
 const li=(i,k)=>`<label class="ck"><input type="checkbox" class="cl" data-i="${i}" ${c.listen>>i&1?'checked':''}><span>${L[k]}</span></label><div class="d">${L[k+'d']}</div>`;
 const chs=['868,1','868,3','868,5','867,1','867,3','867,5','867,7','867,9'];
 $('#opts').innerHTML=`<label class="ck"><input type="checkbox" id="c_obi" ${c.obi?'checked':''}><span>${L.obi}</span></label>`+li(0,'l0')+li(1,'l1')+li(2,'l2')+li(3,'l3')+li(4,'l4')+
  `<div class="chgrid">${chs.map((f,i)=>`<label class="ck"><input type="checkbox" class="cch" data-i="${i}" ${c.lwch>>i&1?'checked':''}>${f}</label>`).join('')}</div>
  <div class="chgrid">${[7,8,9,10,11,12].map((sf,i)=>`<label class="ck"><input type="checkbox" class="csf" data-i="${i}" ${c.lwsf>>i&1?'checked':''}>SF${sf}</label>`).join('')}<span class="mut">${L.sfhint}</span></div>`;
 $('#c_win').value=c.win;$('#c_avh').value=c.avh;}
const mask=s=>$$(s).reduce((m,e)=>m|(e.checked?1<<+e.dataset.i:0),0);
$('#c_save').onclick=async()=>{try{const r=await(await post('/api/unl/cfg',{obi:$('#c_obi').checked?1:0,listen:mask('.cl'),lwch:mask('.cch')||1,lwsf:mask('.csf')||1,win:$('#c_win').value,avh:$('#c_avh').value})).json();
 U.cfg=r.cfg;cfgDrawn=false;drawCfg();$('#c_msg').textContent=L.saved;setTimeout(()=>$('#c_msg').textContent='',3000);}catch(e){$('#c_msg').textContent='Fehler';}};
$('#st_reset').onclick=async()=>{await post('/api/unl/stats/reset');loadUnl();};
let logRows=[],logSince=0,logPaused=false,logNow=0;
const LMODE={1:'T1',2:'C1a',3:'C1b',4:'S1'};
function renderLog(){$('#logb').innerHTML=logRows.slice(-150).reverse().map(e=>`<tr><td class="dim">${age(Math.round((logNow-e.t)/1000))}</td><td>${LIS[e.l+1][0]}${e.l<2&&LMODE[e.m]?' <span class="mut">'+LMODE[e.m]+'</span>':e.l===4?' <span class="mut">SF'+e.m+'</span>':''}</td>
 <td class="mono" style="color:${e.r?'var(--rd)':'var(--tx)'}">${esc(e.who)}</td><td>${e.rssi}</td><td>${e.len}</td><td class="hex2">${fmtHex(e.b)}${e.len>e.b.length/2?' …':''}</td></tr>`).join('');}
async function pollLog(){if(logPaused||tab!=='empfang')return;try{const r=await(await fetch('/api/unl/log?since='+logSince)).json();logNow=r.now;
 if(r.e.length)logRows=logRows.concat(r.e).slice(-300);logSince=r.seq;renderLog();}catch(e){}}
$('#lpause').onclick=()=>{logPaused=!logPaused;$('#lpause').textContent=logPaused?L.resume:L.pause;};
$('#lclear').onclick=()=>{logRows=[];renderLog();};
/* ---------------- start ---------------- */
applyLang();showTab(tab);tick();loadUnl();
setInterval(tick,2000);setInterval(()=>{if(!document.hidden&&tab!=='strom')loadUnl();},4000);setInterval(pollLog,1500);
</script></body></html>
